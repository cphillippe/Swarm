{const g=new THREE.BufferGeometry(),a=new Float32Array(1500*3);for(let i=0;i<1500;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(900);a.set([v.x,v.y,v.z],i*3)}

 let s,kind; const roll=rnd();
 const two2=S.mode==='2d';let ps;if(two2){const k=st2(player.m),pg=(player.m-SURF[k])/((SURF[k+1]||SURF[k]*10)-SURF[k]);ps=k+(k<SURF.length-1&&pg>0.7&&rnd()<(pg-0.7)/0.3*0.6?1:0)}

 for(const a of atoms)spawnAtom(a,true);for(let i=0;i<N;i++)spawnItem(i,true);for(const m of im)m.instanceColor.needsUpdate=true;

   else{let best=-1,bd=1e18;for(let k=0;k<45;k++){const i=(rnd()*N)|0;if(is[i]>R*0.9)continue;const d=(ix[i]-r.p[0])**2+(iy[i]-r.p[1])**2+(iz[i]-r.p[2])**2;if(d<bd){bd=d;best=i}}

  else if(c===0){const w=r*1.8,h=r;ctx.fillStyle=['#e33','#36f','#fc2','#eee','#2b2'][i%5];ctx.fillRect(x-w/2,y-h/2,w,h);ctx.fillStyle='#0008';ctx.fillRect(x-w*.15,y-h*.35,w*.35,h*.7)}
  else if(c===1){const w=r*1.4;ctx.fillStyle='#b5874a';ctx.fillRect(x-w/2,y-w/2,w,w);ctx.strokeStyle='#6b4a22';ctx.lineWidth=Math.max(1,r*.12);ctx.strokeRect(x-w/2,y-w/2,w,w);ctx.beginPath();ctx.moveTo(x-w/2,y-w/2);ctx.lineTo(x+w/2,y+w/2);ctx.moveTo(x+w/2,y-w/2);ctx.lineTo(x-w/2,y+w/2);ctx.stroke()}
  else if(c===2){ctx.fillStyle='#555';ctx.fillRect(x-r*.07,y-r*.2,r*.14,r*1.1);ctx.fillStyle=i%2?'#d22':'#2a7';if(i%2)poly(x,y-r*.4,[0,-r*.6,r*.6,0,0,r*.6,-r*.6,0]);else ctx.fillRect(x-r*.7,y-r*.8,r*1.4,r*.6)}
  else{ctx.fillStyle='#f70';poly(x,y,[0,-r,r*.7,r*.8,-r*.7,r*.8]);ctx.fillStyle='#fff';ctx.fillRect(x-r*.3,y,r*.6,r*.2)}
 }}
function rockPoly(i,x,y,r,col){const p=[];for(let k=0;k<8;k++){const a=k/8*TAU,rr=r*(0.7+0.4*OR[(i*7+k)%OR.length]);p.push(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.fillStyle=col;poly(x,y,p)}
function glow(x,y,r,c){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function crater(x,y,r){circ(x,y,r,'#9a9aa2');circ(x-r*.3,y-r*.2,r*.22,'#77777f');circ(x+r*.35,y+r*.3,r*.15,'#77777f')}
function drawSpace(i,x,y,r,st,c,big){const t=S.t;
 if(st===3){ // Planet
  if(big){rockPoly(i,x+r*.15,y+r*.15,r,'#0003');rockPoly(i,x,y,r,'#3f8a3c');rockPoly(i+3,x-r*.1,y,r*.55,'#8a7a4a')}
  else if(c===0){rockPoly(i,x,y,r,'#e4d29a');rockPoly(i,x,y,r*.7,'#4aa04a')}
  else if(c===1){circ(x,y,r,'#1d5f9e');circ(x-r*.2,y-r*.2,r*.5,'#2f7fc4')}
  else if(c===2){ctx.fillStyle='#7a5c3c';poly(x,y,[0,-r,r,r*.8,-r,r*.8]);ctx.fillStyle='#fff';poly(x,y,[0,-r,r*.3,-r*.4,-r*.3,-r*.4])}
  else if(c===3)crater(x,y,r);
  else{glow(x,y,r*1.6,'#ffd84a88');circ(x,y,r*.8,'#ffcc33')}
 }else if(st===4){ // Star System
  if(big){circ(x,y,r*.75,['#d9b77a','#c9a0ff','#8fd0ff'][i%3]);ctx.strokeStyle='#e8dcbcaa';ctx.lineWidth=Math.max(1,r*.08);ctx.beginPath();ctx.ellipse(x,y,r*1.3,r*.35,-0.3,0,TAU);ctx.stroke()}
  else if(c===0)rockPoly(i,x,y,r,'#6b6560');
  else if(c===1){ctx.fillStyle='#9cf4';poly(x,y,[0,-r*.4,r*3,-r*.1,r*3,r*.1,0,r*.4]);circ(x,y,r*.5,'#dff')}
  else if(c===2)crater(x,y,r);
  else if(c===3){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.clip();const cs=['#c97a4a','#e8b07a','#a85a3a'];for(let k=0;k<5;k++){ctx.fillStyle=cs[k%3];ctx.fillRect(x-r,y-r+k*r*.4,r*2,r*.4)}ctx.restore()}
  else{glow(x,y,r*1.7,'#ffd84a99');circ(x,y,r*.8,'#ffd23b');ctx.strokeStyle='#fff8';ctx.beginPath();ctx.ellipse(x,y,r*1.2,r*.3,0.4,0,TAU);ctx.stroke()}
 }else if(st===5){ // Galaxy
  if(big){glow(x,y,r*1.2,['#c050ff66','#ff508066','#50c0ff66'][i%3]);glow(x+r*.3,y-r*.2,r*.8,'#ffffff33')}
  else if(c===0){glow(x,y,r*1.4,'#fff6a066');circ(x,y,r*.35,'#fff')}
  else if(c===1){for(let k=0;k<7;k++)circ(x+(OR[(i+k)*3%OR.length]-.5)*r*1.6,y+(OR[(i+k)*5%OR.length]-.5)*r*1.6,r*.15,'#ffe')}
  else if(c===2){glow(x,y,r*1.2,'#40ffc066');glow(x+r*.3,y,r*.7,'#ff60c055')}
  else if(c===3){glow(x,y,r*1.3,'#ff704466');circ(x,y,r*.4,'#ff9a6a')}
  else{const a=t*4+i;ctx.strokeStyle='#aef';ctx.lineWidth=Math.max(1,r*.12);ctx.beginPath();ctx.moveTo(x-Math.cos(a)*r*1.6,y-Math.sin(a)*r*1.6);ctx.lineTo(x+Math.cos(a)*r*1.6,y+Math.sin(a)*r*1.6);ctx.stroke();circ(x,y,r*.4,'#fff')}
 }else{ // Black Hole era: eat galaxies
  if(big||c===1){glow(x,y,r*1.1,'#9ab4ff55');ctx.fillStyle='#e8eeff';for(let k=0;k<24;k++){const a=k*0.55+t*0.3,rr=r*k/24;ctx.fillRect(x+Math.cos(a)*rr,y+Math.sin(a)*rr*.6,2,2)}}
  else if(c===0){ctx.fillStyle='#ffeccc88';ctx.beginPath();ctx.ellipse(x,y,r,r*.5,i,0,TAU);ctx.fill()}
  else if(c===2){glow(x,y,r*1.4,'#60c0ff77');circ(x,y,r*.3,'#fff')}
  else if(c===3){for(let k=0;k<5;k++)glow(x+(OR[(i+k)*3%OR.length]-.5)*r*1.4,y+(OR[(i+k)*7%OR.length]-.5)*r*1.4,r*.45,'#ffd0f066')}
  else{glow(x,y,r*1.6,'#b070ff99');circ(x,y,r*.5,'#2a0044')}
 }}
// ---------- debug skip-level
const LV=[['Subatomic',1],['Atoms & Molecules',30],['Dust & Rock',220],...SURFN.map((n,k)=>[n.split(' — ').pop(),SURF[k]])];
function jumpTo(m){if(S.dead)init();player.m=m;player.dash=0;S.best=Math.max(S.best,m);
 if(m>=GRAV){if(S.mode!=='2d')enter2D();else{player.p=[0,0,0];S.cx=S.cy=0;for(let i=0;i<N;i++)spawnItem(i,true)}}
 else{S.mode='3d';player.p=[0,0,0];renderer.domElement.style.display='block';cv.style.display='none';
  stage3=m<ST3[0]?0:m<ST3[1]?1:2;for(const a of atoms)spawnAtom(a,true);
  for(let i=0;i<N;i++)spawnItem(i,true);for(const m of im)m.instanceColor.needsUpdate=true;const PR=rad(m);camera.position.set(0,PR*2,PR*6)}
 for(const r of rivals){spawnRival(r);if(S.mode==='2d'){r.p[2]=0;r.dir=norm([r.dir[0],r.dir[1],0]);r.tgt=r.dir.slice()}}
 banner(stageName().toUpperCase(),1.4)}
function nextStage(){const i=LV.findIndex(l=>l[1]>player.m);jumpTo(LV[i<0?LV.length-1:i][1])}
function dblMass(){const m=player.m*2;if((m>=GRAV)!==(S.mode==='2d'))jumpTo(m);else player.m=m}
{const p=$('dbgp'),stop=e=>e.stopPropagation();for(const ev of['pointerdown','pointerup','pointermove','touchstart','click'])$('dbg').addEventListener(ev,stop);
 const add=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:13px sans-serif;padding:6px 10px;background:#234;color:#fff;border:1px solid #58a;border-radius:4px';b.onclick=e=>{e.stopPropagation();f()};p.appendChild(b)};
 LV.forEach(([n,m])=>add(n,()=>jumpTo(m)));add('Next stage',nextStage);add('+Mass x2',dblMass);
 $('dbgb').onclick=e=>{e.stopPropagation();p.style.display=p.style.display==='flex'?'none':'flex'};}
addEventListener('keydown',e=>{if(e.code==='KeyN')nextStage();if(e.code==='KeyM')dblMass()});
// ---------- loop
let last=performance.now(),hudT=0;
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(!S.dead&&S.mode!=='trans')update(dt);
 if(S.mode==='2d')render2D(dt);else render3D(dt);
 bannerT-=dt;$('banner').style.opacity=bannerT>0?Math.min(1,bannerT/bannerD*2):0;
 if((hudT-=dt)<0){hudT=0.1;$('stage').textContent=stageName();const all=[player,...rivals].sort((a,b)=>b.m-a.m);
  $('mass').textContent='Mass '+fmt(player.m)+'  •  Rank '+(all.indexOf(player)+1)+'/'+all.length;
  const lo=S.mode==='2d'?SURF[st2(player.m)]:[0,...ST3][stage3],hi=S.mode==='2d'?(SURF[st2(player.m)+1]||SURF[SURF.length-1]*10):ST3[stage3];
  $('barf').style.width=Math.max(0,Math.min(100,(player.m-lo)/(hi-lo)*100))+'%';}
 requestAnimationFrame(frame);}
init();requestAnimationFrame(frame);
window.__swarm={get S(){return S},get player(){return player}};
