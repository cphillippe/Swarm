{const g=new THREE.BufferGeometry(),a=new Float32Array(1500*3);for(let i=0;i<1500;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(900);a.set([v.x,v.y,v.z],i*3)}

 cores.instanceMatrix.needsUpdate=true;cores.instanceColor.needsUpdate=true;
 og.setDrawRange(0,n);og.attributes.position.needsUpdate=true;og.attributes.color.needsUpdate=true;oMat.size=PR*0.32;
 renderer.render(scene,camera);}
// ---------- render 2D
const hex=c=>'#'+c.toString(16).padStart(6,'0');
function render2D(dt){const PR=rad(player.m),sc=Math.min(W,H)/(PR*22);S.cx+=(player.p[0]-S.cx)*Math.min(1,dt*6);S.cy+=(player.p[1]-S.cy)*Math.min(1,dt*6);
 const X=x=>(x-S.cx)*sc+W/2,Y=y=>(y-S.cy)*sc+H/2;ctx.setTransform(DPR,0,0,DPR,0,0);
 ctx.fillStyle=player.m<5000?'#5b5246':player.m<22000?'#2f5d34':'#3a3d44';ctx.fillRect(0,0,W,H);
 const g=Math.pow(10,Math.floor(Math.log10(PR*4)));ctx.strokeStyle='#ffffff14';ctx.lineWidth=1;ctx.beginPath();
 for(let x=Math.floor((S.cx-W/2/sc)/g)*g;x<S.cx+W/2/sc;x+=g){ctx.moveTo(X(x),0);ctx.lineTo(X(x),H)}
 for(let y=Math.floor((S.cy-H/2/sc)/g)*g;y<S.cy+H/2/sc;y+=g){ctx.moveTo(0,Y(y));ctx.lineTo(W,Y(y))}ctx.stroke();
 for(let i=0;i<N;i++){const x=X(ix[i]),y=Y(iy[i]),r=is[i]*sc;if(x<-r*2||x>W+r*2||y<-r*2||y>H+r*2)continue;
  if(ik[i]===0){ctx.fillStyle=['#8a8580','#9b9288','#77736e','#a39d94','#6d675f'][ic[i]];ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
  else if(ik[i]===1){ctx.fillStyle='#0003';ctx.beginPath();ctx.arc(x+r*.25,y+r*.25,r,0,TAU);ctx.fill();ctx.fillStyle=['#2e8b3e','#3fa34d','#246b30','#4caf50','#1f5e2a'][ic[i]];ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
  else{const w=r*1.5;ctx.fillStyle='#0004';ctx.fillRect(x-w/2+r*.3,y-w/2+r*.3,w,w);ctx.fillStyle=['#c9b79c','#9fb3c8','#d08c6a','#b0b0b0','#e0d6a8'][ic[i]];ctx.fillRect(x-w/2,y-w/2,w,w);
   ctx.fillStyle='#0002';ctx.fillRect(x-w/2+w*.15,y-w/2+w*.15,w*.7,w*.7)}}
 const t=S.t;for(const s of [...rivals,player]){const R=rad(s.m),x=X(s.p[0]),y=Y(s.p[1]),r=R*sc;if(x<-r*2||x>W+r*2||y<-r*2||y>H+r*2)continue;const c=hex(colFor(s));
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=Math.max(2,r*0.08);ctx.stroke();
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=c;const cnt=Math.min(90,8+Math.sqrt(s.m)*2|0);
  for(let k=0;k<cnt;k++){const o=k*6,a=OR[o+1]*TAU+t*(0.8+OR[o+2])*(OR[o+3]>.5?1:-1),rr=r*(1.02+0.3*OR[o]);ctx.globalAlpha=0.4+OR[o+4]*0.6;ctx.beginPath();ctx.arc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,Math.max(1.5,r*0.04),0,TAU);ctx.fill()}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}}
// ---------- loop
let last=performance.now(),hudT=0;
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(!S.dead&&S.mode!=='trans')update(dt);
 if(S.mode==='2d')render2D(dt);else render3D(dt);
 bannerT-=dt;$('banner').style.opacity=bannerT>0?Math.min(1,bannerT/bannerD*2):0;
 if((hudT-=dt)<0){hudT=0.1;$('stage').textContent=stageName();const all=[player,...rivals].sort((a,b)=>b.m-a.m);
  $('mass').textContent='Mass '+fmt(player.m)+'  •  Rank '+(all.indexOf(player)+1)+'/'+all.length;
  const lo=S.mode==='2d'?GRAV:[0,...ST3][stage3],hi=S.mode==='2d'?(player.m<5000?5000:player.m<22000?22000:1e5):ST3[stage3];
  $('barf').style.width=Math.max(0,Math.min(100,(player.m-lo)/(hi-lo)*100))+'%';}
 requestAnimationFrame(frame);}
init();requestAnimationFrame(frame);
window.__swarm={get S(){return S},get player(){return player}};
</script></body></html>
